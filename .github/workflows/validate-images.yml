name: Validate Docker images

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: ${{ matrix.dockerfile }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        dockerfile:
          - Dockerfile-stable.mini
          - Dockerfile-stable
          - Dockerfile-latest.mini
          - Dockerfile-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          load: true
          push: false
          tags: arturo:validation
      - name: Validate inline execution
        shell: bash
        run: |
          set -euo pipefail
          output=$(docker run --rm arturo:validation -e 'print "Hello from CI"')
          test "$output" = 'Hello from CI'
      - name: Validate mounted script and workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/arturo-smoke"
          printf 'print "Hello from a mounted script"\n' > "$RUNNER_TEMP/arturo-smoke/smoke.art"
          output=$(docker run --rm -v "$RUNNER_TEMP/arturo-smoke:/workspace:ro" arturo:validation smoke.art)
          test "$output" = 'Hello from a mounted script'
